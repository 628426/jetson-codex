services:
  jetson-codex:
    container_name: jetson-codex
    image: jetson-codex:jp62-full
    build:
      context: .
      dockerfile: Dockerfile
      # JetPack 6.x kernel omits iptables raw; avoid Docker's bridge during build.
      network: host
      entitlements:
        - network.host
      platforms: [linux/arm64]
      args:
        INSTALL_PHP: "1"
        INSTALL_SWIFT: "1"
    platform: linux/arm64
    runtime: nvidia
    restart: unless-stopped
    # Keep the container alive; enter on demand using docker exec.
    command: ["sleep", "infinity"]
    # Avoid Docker bridge at runtime too (no ports are published by this service).
    network_mode: host
    stdin_open: true
    tty: true
    init: true
    shm_size: 1gb
    working_dir: /workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      GIT_CONFIG_GLOBAL: /root/.config/git/config
    volumes:
      - ./workspace:/workspace
      - codex-auth:/root/.codex
      - github-auth:/root/.config/gh
      - git-config:/root/.config/git
    # Camera/serial/GPIO devices are deliberately not exposed by default.
    # See run-hardware.sh for opt-in hardware passthrough.
volumes:
  codex-auth:
    name: jetson-codex-auth
  github-auth:
    name: jetson-github-auth
  git-config:
    name: jetson-git-config
