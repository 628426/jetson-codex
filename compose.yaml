services:
  jetson-codex:
    container_name: jetson-codex
    image: ${JETSON_CODEX_IMAGE:-jetson-codex:jp72-base}
    build:
      context: .
      dockerfile: ${JETSON_CODEX_DOCKERFILE:-Dockerfile.jetpack-7.2.0}
      platforms: [linux/arm64]
      args:
        JETSON_CODEX_BUILD_HASH: ${JETSON_CODEX_BUILD_HASH:-untracked}
    platform: linux/arm64
    runtime: nvidia
    restart: unless-stopped
    # Persistent writable layer contains post-up APT/SDK packages.
    # WARNING: compose down/recreate destroys that layer. Use install.sh instead.
    # Keep the container alive; enter on demand using docker exec.
    command: ["bash", "/opt/jetson-codex/container-keepalive.sh"]
    # Host networking retained for local development tools and camera services.
    network_mode: host
    stdin_open: true
    tty: true
    init: true
    shm_size: 1gb
    working_dir: /workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      GIT_CONFIG_GLOBAL: /root/.config/git/config
    volumes:
      # The repository is a read-only control plane for post-up provisioning.
      - type: bind
        source: .
        target: /opt/jetson-codex
        read_only: true
      - ./workspace:/workspace
      # Do not let Docker mkdir the source of a real FUSE filesystem.
      - type: bind
        source: ${HOME}/jetson-codex-cloud
        target: /cloud
        bind:
          create_host_path: false
          propagation: rslave
      # Legacy workspace alias, mapped to the same cloud data (no duplicate files).
      - type: bind
        source: ${HOME}/jetson-codex-cloud
        target: /workspace/projects
        bind:
          create_host_path: false
          propagation: rslave
      - ./workspace/source:/workspace/source
      - codex-auth:/root/.codex
      - github-auth:/root/.config/gh
      - git-config:/root/.config/git
      - git-ssh:/root/.ssh
      - gitlab-auth:/root/.config/glab-cli
      - azure-auth:/root/.azure
    # Camera/serial/GPIO devices are deliberately not exposed by default.
    # See run-hardware.sh for opt-in hardware passthrough.
volumes:
  codex-auth:
    name: jetson-codex-auth
  github-auth:
    name: jetson-github-auth
  git-config:
    name: jetson-git-config
  git-ssh:
    name: jetson-codex-git-ssh
  gitlab-auth:
    name: jetson-codex-gitlab-auth
  azure-auth:
    name: jetson-codex-azure-auth
