services:
  jetson-codex:
    container_name: jetson-codex
    image: ${JETSON_CODEX_IMAGE:-jetson-codex:jp72-full}
    build:
      context: .
      dockerfile: ${JETSON_CODEX_DOCKERFILE:-Dockerfile.jetpack-7.2.0}
      platforms: [linux/arm64]
      args:
        JETSON_CODEX_BUILD_HASH: ${JETSON_CODEX_BUILD_HASH:-untracked}
    platform: linux/arm64
    runtime: nvidia
    restart: unless-stopped
    # Keep the container alive; enter on demand using docker exec.
    command: ["sleep", "infinity"]
    # Host networking retained for local development tools and camera services.
    network_mode: host
    stdin_open: true
    tty: true
    init: true
    shm_size: 1gb
    working_dir: /workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      GIT_CONFIG_GLOBAL: /root/.config/git/config
    volumes:
      - ./workspace:/workspace
      - ${HOME}/jetson-codex-cloud:/workspace/projects:rslave
      - ./workspace/source:/workspace/source
      - codex-auth:/root/.codex
      - github-auth:/root/.config/gh
      - git-config:/root/.config/git
      - git-ssh:/root/.ssh
      - gitlab-auth:/root/.config/glab-cli
      - azure-auth:/root/.azure
    # Camera/serial/GPIO devices are deliberately not exposed by default.
    # See run-hardware.sh for opt-in hardware passthrough.
volumes:
  codex-auth:
    name: jetson-codex-auth
  github-auth:
    name: jetson-github-auth
  git-config:
    name: jetson-git-config
  git-ssh:
    name: jetson-codex-git-ssh
  gitlab-auth:
    name: jetson-codex-gitlab-auth
  azure-auth:
    name: jetson-codex-azure-auth
