name: Validate install and connection scripts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  bash-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax of all installers and helpers
        run: |
          set -euo pipefail
          for file in ./*.sh; do
            bash -n "$file"
          done
      - name: Check Python configuration helper
        run: python3 -m py_compile configure-full-trust.py
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Validate low-peak persistent-container architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          image = Path("Dockerfile.jetpack-7.2.0").read_text()
          assert image == Path("Dockerfile").read_text()
          assert "nvidia/cuda:13.2.1-cudnn-devel-ubuntu24.04" in image
          assert "RUN apt-get" not in image
          assert "RUN --mount" not in image
          assert "COPY --from=mise-binary" in image
          assert "ENV HF_HOME=/cloud/.cache/huggingface" in image
          assert "ENV NVIDIA_VISIBLE_DEVICES=all" in image

          provision = Path("provision-container.sh").read_text()
          assert "DeepStream 9.1" in provision
          assert "10.16.2.10-1+cuda13.2" in provision
          assert "libnvvpi4 vpi4-dev" in provision
          assert "pipx install uv" in provision
          assert "pipx install ruff" in provision
          assert "glab@1.128.0" in provision
          assert "node@26.11.0" in provision
          assert "curl -fLSs" in provision and "tar -xjf - -C /" in provision
          assert "codex-aarch64-unknown-linux-musl" in provision
          assert "apt-get clean" in provision
          assert "provision.sha256" in provision
          assert 'bash /opt/jetson-codex/setup-versions.sh' in provision
          assert "/usr/local/bin/codex-connect" in provision
          for term in ("rustup", "swiftly", "phpenv", "composer", "tritonserver"):
              assert term not in provision.lower()

          install = Path("install.sh").read_text()
          assert "Installer paused before Docker build." in install
          assert "Cloud setup failed or was interrupted. Docker build NOT started." in install
          assert install.index("bash ./storage-health.sh") < install.index("BUILD_INPUTS=") if "BUILD_INPUTS=" in install else True
          assert "provision-container.sh" in install
          assert "JETSON_CODEX_MIGRATE" in install
          assert "docker compose --progress plain build" in install
          assert install.index('bash ./run-hardware.sh') < install.index('bash /opt/jetson-codex/provision-container.sh')
          executable_lines = [line.strip() for line in install.splitlines()
                              if line.strip() and not line.lstrip().startswith("#")]
          assert all(not line.startswith(("docker commit", "docker save", "docker export"))
                     for line in executable_lines)
          assert "docker save " not in install
          assert "docker volume prune" not in install
          assert "bash ./disk-space.sh post" in install
          assert "PROVISION_HASH" in install
          assert "bash ./codex-remote.sh auto" in install
          assert install.index("codex login status") < install.index("bash ./codex-remote.sh auto")
          assert "bash ~/jetson-codex/codex-remote.sh pair" in install

          remote = Path("codex-remote.sh").read_text()
          assert "codex remote-control start --json" in remote
          assert "codex remote-control pair" in remote
          assert "codex login status" in remote
          assert "OFFERED_MARKER" in remote
          assert "docker exec -it" in remote
          assert ">/dev/tty" in remote and "</dev/tty" in remote
          assert 'rm -f' not in remote
          assert "docker rm" not in remote
          assert "docker commit" not in remote
          keepalive = Path("container-keepalive.sh").read_text()
          assert "codex remote-control start --json" in keepalive
          assert "codex login status" in keepalive
          assert "exec sleep infinity" in keepalive

          launch = Path("run-hardware.sh").read_text()
          assert 'target=/cloud,bind-propagation=rslave' in launch
          assert 'target=/workspace/projects,bind-propagation=rslave' in launch
          assert "manual migration required" in launch
          assert 'docker rm -f "$container"' not in launch
          assert "docker start" in launch
          assert 'bash /opt/jetson-codex/container-keepalive.sh' in launch
          assert 'command: ["bash", "/opt/jetson-codex/container-keepalive.sh"]' in Path("compose.yaml").read_text()
          assert 'target=/opt/jetson-codex,readonly' in launch
          compose = Path("compose.yaml").read_text()
          assert "target: /cloud" in compose and "target: /workspace/projects" in compose
          assert "create_host_path: false" in compose
          assert "read_only: true" in compose

          hardware = Path("hardware-check.sh").read_text()
          assert "--deepstream" in hardware and "--tensorrt" in hardware
          assert "nvvideoconvert" in hardware and "nvtracker" in hardware
          assert Path("tensorrt-smoke.cpp").exists()
          assert "enqueueV3" in Path("tensorrt-smoke.cpp").read_text()
          assert "TensorRT GPU inference" in Path("verify.sh").read_text()

          storage = Path("storage-health.sh").read_text()
          assert "storage_healthy()" in storage
          assert "reconnect_oauth()" in storage
          assert "reconfigure_storage()" in storage
          assert "mountpoint -q" in storage and "rclone lsf" in storage
          cloud_mount = Path("cloud-mount.sh").read_text()
          assert "  --allow-other" in cloud_mount
          assert "  --default-permissions" in cloud_mount
          assert "sudo timeout 15 ls -A" in storage

          disk = Path("disk-space.sh").read_text()
          assert "buildx prune --all --force" in disk
          assert "inuse=false" in disk
          assert "volume prune" not in disk and "system prune" not in disk
          print("Low-peak build, persistent upperdir, /cloud mount and safety checks passed")
          PY
      - name: Exercise rclone OAuth/mount health gate with mocks
        run: python3 tests/test_storage_gate.py
      - name: Exercise disk-pressure cleanup with mocked Docker
        run: python3 tests/test_disk_space.py
      - name: Exercise low-peak install invariants
        run: python3 tests/test_low_peak.py
      - name: Exercise native Codex mobile pairing with mocked CLI
        run: python3 tests/test_codex_remote.py
